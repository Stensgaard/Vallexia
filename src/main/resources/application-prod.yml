# Production profile configuration
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://postgres:5432/vallexia
    username: vallexia_user
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # Flyway Database Migration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        '[format_sql]': false
        jdbc:
          '[batch_size]': 20
        '[order_inserts]': true
        '[order_updates]': true
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 900000
    refresh-token-expiration: 86400000
  auth:
    lockout:
      max-failed-attempts: ${MAX_FAILED_ATTEMPTS:5}
      duration-minutes: ${LOCKOUT_DURATION_MINUTES:15}
  audit:
    # Example: 172.17.0.1,10.0.0.1
    trusted-proxies: ${TRUSTED_PROXIES:}
    # Audit log retention period in days
    retention-days: ${AUDIT_RETENTION_DAYS:90}
    # Path for audit fallback log file (when database logging fails)
    fallback-log-path: ${AUDIT_FALLBACK_LOG_PATH:logs/audit-fallback.log}
  cors:
    allowed-origins: 
      - https://yourdomain.com
    allowed-methods: 
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
      - Accept
      - X-Requested-With
    allow-credentials: true
  rate-limiting:
    # Global flag to enable/disable all rate limiting
    enabled: true
    login:
      enabled: true
      requests: 5
      duration-minutes: 1
    registration:
      enabled: true
      requests: 3
      duration-minutes: 15
    general-api:
      enabled: true
      requests: 200
      duration-minutes: 1
    refresh:
      enabled: true
      requests: 10
      duration-minutes: 5

logging:
  level:
    '[com.vallexia]': INFO
    '[org.springframework.security]': WARN
    '[org.hibernate.SQL]': WARN
    '[org.hibernate.type.descriptor.sql.BasicBinder]': WARN
    root: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE_PATH:logs/vallexia.log}
    max-size: 10MB
    max-history: 30
