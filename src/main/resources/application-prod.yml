# Production profile configuration
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/vallexia
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:redis}
  flyway:
    locations: classpath:db/migration
  jpa:
    show-sql: false
    properties:
      hibernate:
        '[format_sql]': false
        jdbc:
          '[batch_size]': 20
        '[order_inserts]': true
        '[order_updates]': true
app:
  auth:
    lockout:
      max-failed-attempts: ${MAX_FAILED_ATTEMPTS:5}
      duration-minutes: ${LOCKOUT_DURATION_MINUTES:15}
  audit:
    fallback-log-path: ${AUDIT_FALLBACK_LOG_PATH:logs/audit-fallback.log}
  cors:
    allowed-origins: 
      - https://vallexia.com
  rate-limiting:
    enabled: true
    login:
      enabled: true
      requests: 5
      duration-minutes: 1
    registration:
      enabled: true
      requests: 3
      duration-minutes: 15
    general-api:
      enabled: true
      requests: 200
      duration-minutes: 1
    refresh:
      enabled: true
      requests: 10
      duration-minutes: 5
logging:
  level:
    '[org.springframework.security]': WARN
    '[org.hibernate.SQL]': WARN
    '[org.hibernate.type.descriptor.sql.BasicBinder]': WARN
    root: WARN
  file:
    name: ${LOG_FILE_PATH:logs/vallexia.log}
