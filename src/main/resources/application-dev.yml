# Development profile configuration
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/vallexia_dev
  data:
    redis:
      host: ${REDIS_HOST:localhost}
  flyway:
    locations: 
      - classpath:db/migration
      - classpath:db/migration-dev
    clean-disabled: false
  jpa:
    show-sql: true
    properties:
      hibernate:
        format-sql: true
app:
  auth:
    lockout:
      max-failed-attempts: 5
      duration-minutes: 15
  audit:
    fallback-log-path: ${AUDIT_FALLBACK_LOG_PATH:deployment/logs/audit-fallback.log}
  cors:
    allowed-origins: 
      - "http://localhost:5173"
      - "http://localhost:3000"
      - "http://127.0.0.1:5173"
      - "http://127.0.0.1:3000"
  rate-limiting:
    enabled: false
logging:
  level:
    '[org.springframework.security]': DEBUG
    '[org.hibernate.SQL]': DEBUG
    '[org.hibernate.type.descriptor.sql.BasicBinder]': DEBUG
  file:
    name: ${LOG_FILE_PATH:deployment/logs/vallexia.log}
