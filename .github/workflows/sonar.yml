name: SonarQube Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Cache OWASP Dependency Check NVD database
        uses: actions/cache@v4
        id: cache-dependency-check
        with:
          path: .dependency-check-data
          key: dependency-check-nvd-${{ runner.os }}
          restore-keys: |
            dependency-check-nvd-${{ runner.os }}-
      
      - name: Check cache status
        run: |
          if [ -d ".dependency-check-data" ] && [ "$(ls -A .dependency-check-data 2>/dev/null)" ]; then
            echo "Cache restored - NVD database found"
            du -sh .dependency-check-data
          else
            echo "Cache miss - will download NVD database"
          fi
      
      - name: Run tests with coverage
        run: mvn clean verify
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: testdb
          DB_USER: postgres
          DB_PASSWORD: postgres
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
            -Dsonar.sources=src/main/java
            -Dsonar.tests=src/test/java
            -Dsonar.java.binaries=target/classes
            -Dsonar.java.test.binaries=target/test-classes
            -Dsonar.javascript.lcov.reportPaths=
            -Dsonar.exclusions=**/web/dist/**,**/web/node_modules/**,**/web/public/**
            -Dsonar.inclusions=**/*.java,**/web/src/**/*.js,**/web/src/**/*.vue,**/*.sql,**/*.yml,**/*.yaml,**/*.json,**/*.xml,**/*.css,**/*.html
            -Dsonar.test.exclusions=**/test/**
            -Dsonar.sourceEncoding=UTF-8
