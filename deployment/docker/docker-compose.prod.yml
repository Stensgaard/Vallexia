# Docker Compose for production environment
name: vallexia-prod

services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres-prod
    env_file:
      - ../../.env
    environment:
      POSTGRES_DB: vallexia
      POSTGRES_USER: vallexia_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - backend-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vallexia_user -d vallexia"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s

  redis:
    image: redis:7-alpine
    container_name: redis-prod
    env_file:
      - ../../.env
    volumes:
      - redis_data:/data
    networks:
      - backend-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 10s

  backend:
    build:
      context: ../..
      dockerfile: deployment/docker/backend/Dockerfile
    container_name: backend-prod
    env_file:
      - ../../.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-network
      - frontend-network
    volumes:
      - ../logs:/app/logs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    stop_grace_period: 30s

  nginx:
    build:
      context: ../..
      dockerfile: deployment/docker/nginx/Dockerfile
    container_name: nginx-prod
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - frontend-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    stop_grace_period: 10s

volumes:
  postgres_data:
  redis_data:

networks:
  backend-network:
    driver: bridge
    internal: true
  frontend-network:
    driver: bridge
