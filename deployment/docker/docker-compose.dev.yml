# Docker Compose for development environment
name: vallexia-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres-dev
    env_file:
      - ../../.env
    environment:
      POSTGRES_DB: vallexia_dev
      POSTGRES_USER: vallexia_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - vallexia-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vallexia_user -d vallexia_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s

  redis:
    image: redis:7-alpine
    container_name: redis-dev
    env_file:
      - ../../.env
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - vallexia-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 10s

  backend:
    build:
      context: ../..
      dockerfile: deployment/docker/backend/Dockerfile
    container_name: backend-dev
    env_file:
      - ../../.env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vallexia-network
    volumes:
      - ../logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    stop_grace_period: 30s

  frontend:
    build:
      context: ../../src/main/java/com/vallexia/web
      dockerfile: ../../../../../../deployment/docker/frontend/Dockerfile.dev
    container_name: frontend-dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api
      - VITE_PROXY_TARGET=http://backend:8080
    networks:
      - vallexia-network
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    stop_grace_period: 10s

volumes:
  postgres_data:
  redis_data:

networks:
  vallexia-network:
    driver: bridge
